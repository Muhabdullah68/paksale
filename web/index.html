<!DOCTYPE html><html><head>
  <!--

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">

  <title>Pak Sale — Buy &amp; Sell Marketplace</title>
  <link rel="manifest" href="manifest.json">
  
  
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #6B0F2B;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }

    // Flutter renders the splash <picture> into the DOM before the engine
    // paints its first frame. Remove it as soon as that frame is ready,
    // otherwise a stale splash can stay on top of the app.
    window.addEventListener("flutter-first-frame", function () {
      removeSplashFromWeb();
    });
  </script>

  <!--
    Safari / WebKit cannot consume the dynamic `import()` callback that
    FlutterFire injects (it fails with a Dart JS-interop type error), so
    Firebase.initializeApp() throws before the app can paint.

    Loading the Firebase JS SDK ourselves and exposing the module namespaces
    as window.firebase_* makes firebase_core_web skip its own loader entirely.
    The modules are served from our origin (web/firebasejs/11.9.1) so the boot
    path no longer depends on www.gstatic.com being reachable.

    startFlutter() is always called, even if the SDK fails to load, so a
    failed preload can never block the app from booting.
  -->
  <script type="module">
    (function () {
      var SERVICES = [
        "app",
        "auth",
        "firestore",
        "storage",
        "database",
        "analytics",
        "messaging",
      ];
      var started = false;

      function startFlutter() {
        if (started) return;
        started = true;
        var script = document.createElement("script");
        script.src = "flutter_bootstrap.js";
        script.async = true;
        document.body.appendChild(script);
      }

      // Never let a slow or blocked SDK request hold the app hostage.
      var fallback = setTimeout(startFlutter, 10000);

      Promise.all(
        SERVICES.map(function (name) {
          return import("./firebasejs/11.9.1/firebase-" + name + ".js");
        })
      )
        .then(function (modules) {
          for (var i = 0; i < SERVICES.length; i++) {
            // FlutterFire reads the app module as `firebase_core`; every
            // other service lives under `firebase_<service>`.
            var key = SERVICES[i] === "app" ? "firebase_core" : "firebase_" + SERVICES[i];
            window[key] = modules[i];
          }
        })
        .catch(function (error) {
          console.error("Firebase SDK preload failed:", error);
        })
        .then(function () {
          clearTimeout(fallback);
          startFlutter();
        });
    })();
  </script>
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  
  <!--
    flutter_bootstrap.js is injected by the module above, after the Firebase
    SDK namespaces are available on window. Do not add a static tag here:
    loading it twice would boot the Flutter engine twice.
  -->


</body></html>

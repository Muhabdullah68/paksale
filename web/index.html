<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pak Sale — Buy and sell cars, properties, electronics, jobs and more across Pakistan. Post ads free, chat with sellers, and browse thousands of local listings.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pak Sale">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon (?v=3 busts browser-cached Flutter icon) -->
  <link rel="icon" type="image/png" href="favicon.png?v=3">

  <title>Pak Sale — Buy &amp; Sell Marketplace</title>
  <link rel="manifest" href="manifest.json">
  
  
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #6B0F2B;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Boot trace: shown until the app paints its first frame. Makes device-specific
       boot failures visible on screen where no devtools are available. -->
  <div id="boot-status" style="position:fixed;left:0;right:0;bottom:0;z-index:99999;font:11px/1.45 ui-monospace,monospace;color:#FFF8E7;background:rgba(26,18,16,.85);padding:6px 8px;text-align:center;pointer-events:none;-webkit-user-select:none;user-select:none;">booting…</div>
  <script>
    (function () {
      var el = document.getElementById('boot-status');
      var lines = [];
      window.__bootLog = function (msg) {
        lines.push(msg);
        if (lines.length > 4) lines.shift();
        if (el) el.textContent = lines.join('  |  ');
      };
      window.addEventListener('error', function (e) {
        window.__bootLog('JS ERROR: ' + (e.message || (e.error && e.error.message) || 'unknown'));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        window.__bootLog('PROMISE: ' + ((r && r.message) || r || 'unknown'));
      });
      window.__bootLog('html ready');
    })();
  </script>

  <script type="module">
    // Load the Firebase JS SDK from our own origin. flutterfire otherwise injects a dynamic
    // module import from www.gstatic.com for every service and awaits a Completer that never
    // completes if that import fails — which hangs Firebase.initializeApp() before runApp(),
    // leaving the splash on screen forever. Pre-defining these globals skips the CDN entirely.
    var FIREBASE_SDK_VERSION = '11.9.1';
    var SERVICES = ['app', 'auth', 'firestore', 'storage', 'database', 'analytics', 'messaging'];

    try {
      var modules = await Promise.all(SERVICES.map(function (name) {
        return import('./firebasejs/' + FIREBASE_SDK_VERSION + '/firebase-' + name + '.js');
      }));
      window.firebase_core = modules[0];
      window.firebase_auth = modules[1];
      window.firebase_firestore = modules[2];
      window.firebase_storage = modules[3];
      window.firebase_database = modules[4];
      window.firebase_analytics = modules[5];
      window.firebase_messaging = modules[6];
      window.__bootLog('firebase sdk local ok');
    } catch (e) {
      // Fall through and still start Flutter: flutterfire will retry from its own CDN.
      window.__bootLog('firebase sdk FAILED: ' + ((e && e.message) || e));
    }

    // Start Flutter only once the SDK globals exist, so bootstrap order is deterministic.
    var bootstrap = document.createElement('script');
    bootstrap.src = 'flutter_bootstrap.js';
    bootstrap.async = true;
    bootstrap.onload = function () { window.__bootLog('engine loader running'); };
    bootstrap.onerror = function () { window.__bootLog('engine loader FAILED to load'); };
    document.body.appendChild(bootstrap);

    // Drop the HTML splash once the engine has mounted its DOM host (i.e. the app is painting).
    var elapsed = 0;
    var poll = setInterval(function () {
      elapsed += 200;
      var host = document.querySelector('flt-glass-pane') || document.querySelector('flt-scene-host');
      if (host) {
        clearInterval(poll);
        if (typeof removeSplashFromWeb === 'function') removeSplashFromWeb();
        var banner = document.getElementById('boot-status');
        if (banner) banner.remove();
      } else if (elapsed > 30000) {
        clearInterval(poll);
        window.__bootLog('engine never mounted (30s)');
      }
    }, 200);
  </script>


</body></html>
